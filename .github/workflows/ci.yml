name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
        if: matrix.node == 24
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test with MCP Inspector
        if: matrix.node == 24
        run: |
          npx -y @modelcontextprotocol/inspector --cli node dist/cli.js --method tools/list \
            | jq -e '.tools | length == 5'
